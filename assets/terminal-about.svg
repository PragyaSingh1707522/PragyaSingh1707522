<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1744"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .t { font-size: 15px; fill: #E2E8F0; }
    .p { fill: #FF477E; }
    .k { fill: #C026D3; }
    .v { fill: #F9A8D4; }
    .g { fill: #4ADE80; }
    .line { opacity: 0; animation: show 16s infinite; }
    @keyframes show {
      0% { opacity: 0; }
      2%, 92% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    .l1 { animation-delay: 0.2s; } .l2 { animation-delay: 1.2s; }
    .l3 { animation-delay: 2.2s; } .l4 { animation-delay: 3.2s; }
    .l5 { animation-delay: 4.2s; } .l6 { animation-delay: 5.2s; }
    .l7 { animation-delay: 6.2s; } .l8 { animation-delay: 7.2s; }
    .l9 { animation-delay: 8.2s; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
 
  <rect x="4" y="4" width="692" height="392" rx="14" fill="#0D1117" stroke="url(#bar)" stroke-width="2" filter="url(#glow)"/>
  <rect x="4" y="4" width="692" height="36" rx="14" fill="#161B22"/>
  <rect x="4" y="24" width="692" height="16" fill="#161B22"/>
  <circle cx="28" cy="22" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="22" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="22" r="6" fill="#27C93F"/>
  <text x="350" y="27" text-anchor="middle" font-size="12" fill="#94A3B8">pragya@github: ~/about</text>
 
  <g class="t">
    <text class="line l1" x="24" y="72"><tspan class="p">$</tspan> whoami</text>
    <text class="line l2" x="24" y="98"><tspan class="g">pragya-singh</tspan></text>
 
    <text class="line l3" x="24" y="132"><tspan class="p">$</tspan> cat profile.json</text>
    <text class="line l4" x="24" y="158">{</text>
    <text class="line l5" x="44" y="184"><tspan class="k">"role"</tspan>: <tspan class="v">"Software Engineer"</tspan>,</text>
    <text class="line l6" x="44" y="210"><tspan class="k">"education"</tspan>: <tspan class="v">"BIT Mesra (MSc Maths &amp; Computing)"</tspan>,</text>
    <text class="line l7" x="44" y="236"><tspan class="k">"stack"</tspan>: [<tspan class="v">"MERN"</tspan>, <tspan class="v">"Python"</tspan>, <tspan class="v">"FastAPI"</tspan>],</text>
    <text class="line l8" x="44" y="262"><tspan class="k">"focus"</tspan>: <tspan class="v">"Full-Stack + AI/ML"</tspan>,</text>
    <text class="line l8" x="44" y="288"><tspan class="k">"status"</tspan>: <tspan class="v">"open to work"</tspan></text>
    <text class="line l8" x="24" y="314">}</text>
 
    <text class="line l9" x="24" y="354"><tspan class="p">$</tspan> echo "let's build something"</text>
    <rect class="line l9 cur" x="270" y="341" width="9" height="16" fill="#FF477E"/>
  </g>
</svg>
 
